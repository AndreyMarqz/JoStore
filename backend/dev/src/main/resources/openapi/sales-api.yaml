openapi: "3.0.3"
info:
  title: "JoStore — Ciclo completo de vendas"
  version: "1.0.0"
  description: "RF e RN conforme DRS_LES_2_2026. Sessão local de demonstração; autenticação real ainda não faz parte deste contrato. Pagamento simulado: final 0000 reprova. Reservas padrão de 600 segundos, aviso nos últimos 300. Rotina automática valida pedidos e libera reservas. Operações de teste de relógio existem somente no perfil e2e e não são API de negócio."
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  "/products":
    get:
      summary: "Consulta o catálogo"
      parameters: []
      responses:
        "200":
          description: "Consulta o catálogo"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Product"
        "404":
          description: "Recurso não encontrado ou não pertence ao cliente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Regra de negócio violada: estado inválido, estoque, cupom, pagamento ou quantidade."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/customers/{customerId}/cart":
    get:
      summary: "RF0031/RNF0042 — Carrinho, reserva e itens removidos"
      parameters:
        - name: "customerId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "RF0031/RNF0042 — Carrinho, reserva e itens removidos"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Cart"
        "404":
          description: "Recurso não encontrado ou não pertence ao cliente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Regra de negócio violada: estado inválido, estoque, cupom, pagamento ou quantidade."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/customers/{customerId}/cart/items":
    post:
      summary: "RF0031/RF0032/RN0031/RN0044 — Adiciona e reserva"
      parameters:
        - name: "customerId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "201":
          description: "RF0031/RF0032/RN0031/RN0044 — Adiciona e reserva"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Cart"
        "404":
          description: "Recurso não encontrado ou não pertence ao cliente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Regra de negócio violada: estado inválido, estoque, cupom, pagamento ou quantidade."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                productId:
                  type: "string"
                  format: "uuid"
                size:
                  type: "string"
                  minLength: 1
                quantity:
                  type: "integer"
                  minimum: 1
                  maximum: 99
              required:
                - "productId"
                - "size"
                - "quantity"
  "/customers/{customerId}/cart/items/{itemId}":
    put:
      summary: "RF0032 — Altera quantidade e reserva"
      parameters:
        - name: "customerId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "itemId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "RF0032 — Altera quantidade e reserva"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Cart"
        "404":
          description: "Recurso não encontrado ou não pertence ao cliente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Regra de negócio violada: estado inválido, estoque, cupom, pagamento ou quantidade."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                productId:
                  type: "string"
                  format: "uuid"
                size:
                  type: "string"
                  minLength: 1
                quantity:
                  type: "integer"
                  minimum: 1
                  maximum: 99
              required:
                - "productId"
                - "size"
                - "quantity"
    delete:
      summary: "RN0045 — Remove todas as linhas do produto e libera reserva"
      parameters:
        - name: "customerId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        - name: "itemId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "RN0045 — Remove todas as linhas do produto e libera reserva"
        "404":
          description: "Recurso não encontrado ou não pertence ao cliente."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Regra de negócio violada: estado inválido, estoque, cupom, pagamento ou quantidade."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
  "/customers/{customerId}/orders/quote":
    post:
      summary: "RF0034/RN0032 — Revalida estoque e calcula R$15 + R$2/peça + R$10 fora de SP"
      parameters:
        - name: "customerId"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "RF0034/RN0032 — Revalida estoque e calcula R$15 + R$2/peça + R$10 fora de SP"
          content:
            "application/json":
              schema:
