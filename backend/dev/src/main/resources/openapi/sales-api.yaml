components:
  schemas:
    OrderStatus:
      type: "string"
      enum:
        - "EM_PROCESSAMENTO"
        - "APROVADA"
        - "REPROVADA"
        - "EM_TRANSPORTE"
        - "ENTREGUE"
        - "EM_TROCA"
        - "TROCA_AUTORIZADA"
        - "TROCADO"
    Product:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        code:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        price:
          type: "number"
          format: "double"
        imageUrl:
          type: "string"
          nullable: true
        availableQuantity:
          type: "integer"
      required:
        - "id"
        - "code"
        - "name"
        - "description"
        - "price"
        - "imageUrl"
        - "availableQuantity"
    CartItem:
      type: "object"
      properties:
        id:
