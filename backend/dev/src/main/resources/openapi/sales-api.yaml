              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: "Regra de negócio violada: estado inválido, estoque, cupom, pagamento ou quantidade."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/QuoteRequest"
