spring.application.name=dev

spring.datasource.url=jdbc:postgresql://localhost:5432/jostore
spring.datasource.username=jostore
spring.datasource.password=jostore_dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Reserva renovada a cada inclusão no carrinho (10 minutos).
jostore.cart.reservation-seconds=600
# Processamento de pagamentos simulados e liberação de reservas expiradas.
jostore.sales.scheduler-enabled=true
jostore.sales.poll-ms=1000
