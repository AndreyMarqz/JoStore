services:
  postgres:
    image: postgres:18-alpine
    container_name: jostore-postgres
    environment:
      POSTGRES_DB: jostore
      POSTGRES_USER: jostore
      POSTGRES_PASSWORD: jostore_dev
    ports:
      - "5432:5432"
    volumes:
      - jostore_postgres_data:/var/lib/postgresql

  postgres-e2e:
    image: postgres:18-alpine
    container_name: jostore-postgres-e2e
    profiles: ["e2e"]
    environment:
      POSTGRES_DB: jostore_e2e
      POSTGRES_USER: jostore
      POSTGRES_PASSWORD: jostore_dev
    ports:
      - "5433:5432"
    volumes:
      - jostore_postgres_e2e_data:/var/lib/postgresql

volumes:
  jostore_postgres_data:
  jostore_postgres_e2e_data:
