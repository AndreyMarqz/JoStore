<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2380" viewBox="0 0 1500 2380" role="img" aria-labelledby="title description">
  <title id="title">JoStore - Diagrama de Classes de Controle</title>
  <desc id="description">Diagrama UML das controllers implementadas e planejadas do JoStore.</desc>
  <style>
    .title { font: 700 30px Arial, sans-serif; fill: #1f1f1f; }
    .subtitle { font: 16px Arial, sans-serif; fill: #555; }
    .group { font: 700 18px Arial, sans-serif; fill: #333; }
    .class-title { font: 700 17px Arial, sans-serif; fill: #161616; text-anchor: middle; }
    .member { font: 14px 'Courier New', monospace; fill: #181818; }
    .note { font: 14px Arial, sans-serif; fill: #333; }
    .box { fill: #fff; stroke: #303030; stroke-width: 1.5; }
    .implemented { fill: #dceBff; stroke: #303030; stroke-width: 1.5; }
    .planned { fill: #f2f2f2; stroke: #303030; stroke-width: 1.5; }
    .divider { stroke: #303030; stroke-width: 1.2; }
  </style>
  <rect width="1500" height="2380" fill="#fafafa"/>
  <text x="750" y="52" class="title" text-anchor="middle">JoStore - Diagrama de Classes de Controle</text>
  <text x="750" y="80" class="subtitle" text-anchor="middle">Azul: implementada | Cinza: planejada</text>

  <text x="45" y="125" class="group">Gestão de clientes</text>
  <g transform="translate(45 145)">
    <rect class="box" width="680" height="330" rx="3"/>
    <rect class="implemented" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">CustomerController</text>
    <line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- customerService : CustomerService</text>
    <line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ register(request : CustomerRegistrationRequestDto) : ResponseEntity&lt;CustomerResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ list(code, fullName, cpf, email : String, status : CustomerStatusEnum, page, size : int)</text>
    <text x="30" y="156" class="member">: Page&lt;CustomerSummaryResponseDto&gt;</text>
    <text x="15" y="184" class="member">+ getById(customerId : UUID) : CustomerResponseDto</text>
    <text x="15" y="212" class="member">+ update(customerId : UUID, request : CustomerUpdateRequestDto) : CustomerResponseDto</text>
    <text x="15" y="240" class="member">+ updatePassword(customerId : UUID, request : CustomerPasswordUpdateRequestDto) : ResponseEntity&lt;Void&gt;</text>
    <text x="15" y="268" class="member">+ updateStatus(customerId : UUID, request : CustomerStatusUpdateRequestDto) : CustomerResponseDto</text>
  </g>
  <g transform="translate(765 145)">
    <rect class="box" width="680" height="190" rx="3"/><rect class="implemented" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">AddressController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- customerService : CustomerService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ add(customerId : UUID, request : AddressRequestDto) : ResponseEntity&lt;CustomerResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ update(customerId : UUID, addressId : UUID, request : AddressRequestDto) : CustomerResponseDto</text>
    <text x="15" y="164" class="member">+ delete(customerId : UUID, addressId : UUID) : ResponseEntity&lt;Void&gt;</text>
  </g>
  <g transform="translate(765 355)">
    <rect class="box" width="680" height="190" rx="3"/><rect class="implemented" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">CreditCardController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- customerService : CustomerService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ add(customerId : UUID, request : CreditCardRequestDto) : ResponseEntity&lt;CustomerResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ delete(customerId : UUID, cardId : UUID) : ResponseEntity&lt;Void&gt;</text>
    <text x="15" y="164" class="member">+ setPreferred(customerId : UUID, cardId : UUID) : CustomerResponseDto</text>
  </g>

  <text x="45" y="600" class="group">Acesso e catálogo</text>
  <g transform="translate(45 620)">
    <rect class="box" width="680" height="190" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">AuthenticationController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- authenticationService : AuthenticationService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ login(request : LoginRequestDto) : ResponseEntity&lt;LoginResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ refreshToken(request : RefreshTokenRequestDto) : ResponseEntity&lt;LoginResponseDto&gt;</text>
    <text x="15" y="164" class="member">+ logout() : ResponseEntity&lt;Void&gt;</text>
  </g>
  <g transform="translate(765 620)">
    <rect class="box" width="680" height="300" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">ProductController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- productService : ProductService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ create(request : ProductRequestDto) : ResponseEntity&lt;ProductResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ list(filter : ProductFilterDto, page, size : int) : Page&lt;ProductSummaryResponseDto&gt;</text>
    <text x="15" y="164" class="member">+ getById(productId : UUID) : ProductResponseDto</text>
    <text x="15" y="192" class="member">+ update(productId : UUID, request : ProductRequestDto) : ProductResponseDto</text>
    <text x="15" y="220" class="member">+ updateStatus(productId : UUID, request : ProductStatusUpdateRequestDto) : ProductResponseDto</text>
    <text x="15" y="248" class="member">+ addVariation(productId : UUID, request : ProductVariationRequestDto) : ProductResponseDto</text>
    <text x="15" y="276" class="member">+ updateVariation(...) / deleteVariation(...) : ProductResponseDto / ResponseEntity&lt;Void&gt;</text>
  </g>
  <g transform="translate(45 840)">
    <rect class="box" width="680" height="190" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">InventoryController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- inventoryService : InventoryService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ registerEntry(request : InventoryEntryRequestDto) : ResponseEntity&lt;InventoryMovementResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ listMovements(variationId : UUID, page, size : int) : Page&lt;InventoryMovementResponseDto&gt;</text>
    <text x="15" y="164" class="member">+ getAvailableQuantity(variationId : UUID) : InventoryBalanceResponseDto</text>
  </g>

  <text x="45" y="1090" class="group">Compra e pedidos</text>
  <g transform="translate(45 1110)">
    <rect class="box" width="680" height="245" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">CartController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- cartService : CartService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ getCurrentCart(customerId : UUID) : CartResponseDto</text>
    <text x="15" y="136" class="member">+ addItem(customerId : UUID, request : CartItemRequestDto) : CartResponseDto</text>
    <text x="15" y="164" class="member">+ updateItemQuantity(customerId : UUID, itemId : UUID, request : CartItemQuantityRequestDto) : CartResponseDto</text>
    <text x="15" y="192" class="member">+ removeItem(customerId : UUID, itemId : UUID) : ResponseEntity&lt;Void&gt;</text>
    <text x="15" y="220" class="member">+ clear(customerId : UUID) : ResponseEntity&lt;Void&gt;</text>
  </g>
  <g transform="translate(765 1110)">
    <rect class="box" width="680" height="160" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">CheckoutController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- checkoutService : CheckoutService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ preview(customerId : UUID, request : CheckoutPreviewRequestDto) : CheckoutResponseDto</text>
    <text x="15" y="136" class="member">+ finish(customerId : UUID, request : CheckoutRequestDto) : ResponseEntity&lt;OrderResponseDto&gt;</text>
  </g>
  <g transform="translate(765 1290)">
    <rect class="box" width="680" height="275" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">OrderController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- orderService : OrderService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ listByCustomer(customerId : UUID, page, size : int) : Page&lt;OrderSummaryResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ getById(customerId : UUID, orderId : UUID) : OrderResponseDto</text>
    <text x="15" y="164" class="member">+ list(filter : OrderFilterDto, page, size : int) : Page&lt;OrderSummaryResponseDto&gt;</text>
    <text x="15" y="192" class="member">+ approvePayment(orderId : UUID) / rejectPayment(orderId : UUID, request : RejectionReasonRequestDto)</text>
    <text x="15" y="220" class="member">: OrderResponseDto</text>
    <text x="15" y="248" class="member">+ dispatch(orderId : UUID) / confirmDelivery(orderId : UUID) : OrderResponseDto</text>
  </g>
  <g transform="translate(45 1375)">
    <rect class="box" width="680" height="190" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">CouponController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- couponService : CouponService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ listAvailableByCustomer(customerId : UUID) : List&lt;CouponResponseDto&gt;</text>
    <text x="15" y="136" class="member">+ createPromotional(request : PromotionalCouponRequestDto) : ResponseEntity&lt;CouponResponseDto&gt;</text>
    <text x="15" y="164" class="member">+ updateStatus(couponId : UUID, request : StatusRequestDto) : CouponResponseDto</text>
  </g>
  <g transform="translate(45 1585)">
    <rect class="box" width="680" height="215" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">ExchangeController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- exchangeService : ExchangeService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ request(customerId : UUID, orderId : UUID, request : ExchangeRequestDto) : ExchangeResponseDto</text>
    <text x="15" y="136" class="member">+ list(filter : ExchangeFilterDto, page, size : int) : Page&lt;ExchangeResponseDto&gt;</text>
    <text x="15" y="164" class="member">+ authorize(exchangeId : UUID) : ExchangeResponseDto</text>
    <text x="15" y="192" class="member">+ confirmReceipt(exchangeId : UUID, request : ExchangeReceiptRequestDto) : ExchangeResponseDto</text>
  </g>

  <text x="45" y="1855" class="group">Análise</text>
  <g transform="translate(45 1875)">
    <rect class="box" width="680" height="160" rx="3"/><rect class="planned" width="680" height="42" rx="3"/>
    <text x="340" y="27" class="class-title">SalesAnalysisController</text><line x1="0" y1="42" x2="680" y2="42" class="divider"/>
    <text x="15" y="67" class="member">- salesAnalysisService : SalesAnalysisService</text><line x1="0" y1="81" x2="680" y2="81" class="divider"/>
    <text x="15" y="108" class="member">+ getSalesHistory(filter : SalesAnalysisFilterDto) : SalesAnalysisResponseDto</text>
    <text x="15" y="136" class="member">+ exportSalesHistory(filter : SalesAnalysisFilterDto) : ResponseEntity&lt;byte[]&gt;</text>
  </g>

  <rect x="45" y="2110" width="1400" height="150" fill="#fffdf1" stroke="#b99d47" stroke-width="1.2" rx="3"/>
  <text x="70" y="2145" class="note" font-weight="bold">Observações de escopo</text>
  <text x="70" y="2175" class="note">O diagrama adapta o DRS de livros para o e-commerce de moda. Variações (tamanho e cor) são métodos de ProductController.</text>
  <text x="70" y="2203" class="note">Categoria, marca, cálculo de frete e integração de pagamento serão tratados por services e DTOs dos módulos de produto e checkout.</text>
  <text x="70" y="2231" class="note">Autenticação, catálogo, estoque, carrinho, pedidos, cupom, troca e análise ainda são classes planejadas.</text>
</svg>
